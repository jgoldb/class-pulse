<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2f5fd0" />
    <title>You're offline · Pulsera</title>
    <style>
      :root { font-family: system-ui, sans-serif; color: #1b2233; background: #f5f7fb; color-scheme: light; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; }
      main { max-width: 28rem; margin: 1.5rem; padding: 2rem; background: white; border: 1px solid #dce3ef; border-radius: 1.5rem; }
      .brand { color: #2f5fd0; font-weight: 700; } h1 { font-size: 1.75rem; }
      p { line-height: 1.6; } a { display: inline-block; margin-top: .75rem; background: #2f5fd0; color: white; padding: .8rem 1.25rem; border-radius: .75rem; font-weight: 600; text-decoration: none; }
      a:focus-visible { outline: 3px solid #1b2233; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">Pulsera</div>
      <h1>You're offline</h1>
      <p>Connect to the internet to open your classroom and continue working. Pulsera needs a connection to load records and save changes.</p>
      <a href="">Try again</a>
    </main>
  </body>
</html>
